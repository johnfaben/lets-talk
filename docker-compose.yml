services:
  questions:
    build: .
    ports:
      - "8099:8099"
    volumes:
      - db-data:/app/instance
    env_file:
      - .env
    restart: unless-stopped

volumes:
  db-data:

# Caddy reverse proxy snippet (add to your Caddyfile):
# questions.yourdomain.com {
#     reverse_proxy localhost:8099
# }
