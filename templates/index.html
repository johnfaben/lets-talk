<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Talk!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Let's Talk!</h1>
            <p class="subtitle">Conversation starters for parents &amp; kids</p>
        </header>

        <div class="card-wrapper">
            <div class="card" id="question-card">
                <p class="question-text" id="question-text">Loading...</p>
                <span class="badge" id="source-badge"></span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-down" id="btn-down" title="Thumbs down" aria-label="Thumbs down">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" fill="none" stroke-width="2"/>
                    <circle cx="8.5" cy="10" r="1.5" stroke="none"/>
                    <circle cx="15.5" cy="10" r="1.5" stroke="none"/>
                    <path d="M8.5 16.5Q12 13.5 15.5 16.5" fill="none" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="btn btn-skip" id="btn-skip" title="Skip" aria-label="Skip">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                    <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/>
                </svg>
            </button>
            <button class="btn btn-up" id="btn-up" title="Good question" aria-label="Good question">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" fill="none" stroke-width="2"/>
                    <circle cx="8.5" cy="10" r="1.5" stroke="none"/>
                    <circle cx="15.5" cy="10" r="1.5" stroke="none"/>
                    <path d="M8.5 15.5Q12 18.5 15.5 15.5" fill="none" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="btn btn-love" id="btn-love" title="Love this question!" aria-label="Love this question">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" fill="none" stroke-width="2"/>
                    <path d="M7 9.5C7 8.12 7.88 7.5 8.75 7.5S10.5 8.12 10.5 9.5C10.5 11 8.75 12 8.75 12S7 11 7 9.5z" stroke="none"/>
                    <path d="M13.5 9.5C13.5 8.12 14.38 7.5 15.25 7.5S17 8.12 17 9.5C17 11 15.25 12 15.25 12S13.5 11 13.5 9.5z" stroke="none"/>
                    <path d="M8 15.5Q12 19 16 15.5" fill="none" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div class="stats" id="stats"></div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
